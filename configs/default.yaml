reader:
  backend: auto
  fallback: openslide
  thumbnail_width: 2048

heuristic_pipe:
  - density

patching:
  level: 0
  mpp: 0.5
  patch_size: 600
  output_size: 600
  stride: 600
  min_region_fraction: 0.10
  inclusion: fraction

output:
  root: outputs/patches
  mode: tar
  permissions: "777"
  jpeg_quality: 95
  tar_preview: true
  tar_preview_n: 20

parallel:
  slide_workers: 4
  read_workers_per_slide: 4
  encode_workers: 2
  writer_workers: 2
  max_inflight_patches: 32
  max_inflight_bytes: 536870912
